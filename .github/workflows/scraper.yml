name: Periodic Exeter HMO Scraper

on:
  schedule:
    # Run every night at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manually clicking "Run workflow" in GitHub Actions tab anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Exeter HMO Scraper
        run: |
          python periodic_scraper.py
