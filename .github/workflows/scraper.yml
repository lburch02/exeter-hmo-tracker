name: RoomRadar Periodic Scraper

on:
  schedule:
    # Run every night at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manually clicking "Run workflow" in GitHub Actions tab anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run RoomRadar Property Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_CITIES: "exeter,bristol,manchester,leeds,birmingham"
          MAX_PAGES_PER_CITY: "3"
        run: |
          python periodic_scraper.py

      - name: Run RoomRadar Agency Review Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python agency_review_scraper.py
