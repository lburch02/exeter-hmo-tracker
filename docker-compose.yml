services:
  api:
    build: .
    container_name: roomradar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/roomradar.db
    volumes:
      # Persist SQLite database across container restarts & rebuilds
      - roomradar_data:/app/data

volumes:
  roomradar_data:
    driver: local
